[project]
name = "appicon"
version = "2.0.0.dev0"
description = "Download App Store app icons at full resolution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Legacy scripts, kept until the new CLI replaces them; delete these entries along with the files.
extend-exclude = [
    "AppMetadata.py",
    "appstore_parser.py",
    "downloader.py",
    "search.py",
    "*.spec",
    "src/constants.py",
    "src/utils",
    "src/obsolete",
    "tests/__init__.py",
    "tests/commons.py",
    "tests/test_downloader.py",
    "tests/test_image_util.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/appicon", "tests/unit"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = ["network: talks to real Apple endpoints (regression tests)"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
