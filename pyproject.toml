[project]
name = "appicon"
version = "2.0.0"
description = "Download App Store app icons at full resolution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28.1",
    "pillow>=13.0.0",
    "typer>=0.29.2",
]

[project.scripts]
appicon = "appicon.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
# Name modules by path (tests.unit.conftest) so the two conftest.py files do not clash.
explicit_package_bases = true
mypy_path = "src"
files = ["src/appicon", "tests/unit", "tests/regression"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = ["network: talks to real Apple endpoints (regression tests)"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]
