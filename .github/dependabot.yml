# Low-noise setup: at most one version-update PR per ecosystem per month.
# Security updates are not grouped and still arrive as soon as they are found.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
